<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Gunny</title>
  <style>
    html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
    #game { display: block; }
  </style>
</head>
<body>
  <!--
    Tham số giữ đúng như trang PlayGame.aspx thật:
      allowScriptAccess="always"  -> bắt buộc để JS gọi được ExternalInterface
      wmode                       -> "direct" cho Stage3D/Starling chạy GPU;
                                     "window" thì Flash có cửa sổ riêng, hết
                                     tranh focus với lớp vẽ đè nhưng mất GPU.
                                     Đổi ở menu Đồ họa, phải nạp lại game.
    __SWF_URL__ / __WIDTH__ / __HEIGHT__ / __QUALITY__ / __SCALE__ do
    GameWebView::loadGame thay vào. Chất lượng và kiểu co giãn phải đặt ở đây
    chứ không đổi được lúc chạy: Flash chỉ đọc chúng khi dựng plugin, nên menu
    đổi xong là nạp lại game.
  -->
  <embed id="game"
         name="game"
         src="__SWF_URL__"
         width="__WIDTH__"
         height="__HEIGHT__"
         quality="__QUALITY__"
         scale="__SCALE__"
         bgcolor="#000000"
         wmode="__WMODE__"
         allowscriptaccess="always"
         allowfullscreen="true"
         type="application/x-shockwave-flash" />

  <script type="text/javascript">
    // Hàm game gọi ra host qua ExternalInterface.call(...). Chuyển tiếp về C++
    // bằng object `tool` đã gắn qua addToJavaScriptWindowObject.
    function BrowserAgent() { return navigator.userAgent; }
    function IsDesktop() { return true; }

    // Hàng lệnh gửi vào SWF đã patch.
    //
    // Không gọi thẳng JS -> Flash: qua NPObject thì chập chờn với wmode=direct,
    // lúc thấy callback lúc không, kể cả callback của game gốc. Chiều ngược lại
    // luôn chạy, nên SWF hỏi hàm này 250ms một lần và tự lấy lệnh về.
    // Hàng đợi chứ không phải một ô: một cú bấm có thể xếp cả trăm lệnh (quét
    // tham số 0→100), và hai cú bấm liền nhau trong 250ms cũng không được nuốt
    // mất cái trước.
    window.__toolQueue = [];
    function toolPoll() {
      var q = window.__toolQueue || [];
      return q.length ? String(q.shift()) : '';
    }

    // SWF báo kết quả ngược ra; chuyển tiếp về C++ để hiện trên tiêu đề.
    function toolLog(msg) {
      try { if (window.tool) { window.tool.log(String(msg)); } } catch (e) {}
    }

    function forward(name) {
      return function () {
        try {
          var args = Array.prototype.slice.call(arguments).join(', ');
          if (window.tool) { window.tool.log(name + '(' + args + ')'); }
        } catch (e) { /* host chưa sẵn sàng thì bỏ qua */ }
      };
    }

    // setDailyTask/setDailyActivity cố tình không có ở đây: game gọi chúng mỗi
    // khung hình trong lúc thanh tiến trình chạy, có lúc bốn chục lần một giây.
    // Chuyển tiếp hết sang host thì mỗi lần là một cú gọi qua NPObject cộng một
    // lượt ghi tệp — đủ để game giật. Hai giá trị đó cũng không ai dùng.
    var hostCalls = ['ExternalLoadStart', 'ExternalLoadStop', 'WindowReturn',
                     'toLocation', 'tellVersion', 'loadConfig', 'setFatigue'];
    for (var i = 0; i < hostCalls.length; i++) {
      window[hostCalls[i]] = forward(hostCalls[i]);
    }
  </script>
</body>
</html>
